line-length = 120
target-version = "py312"
exclude = ["*/migrations/*"]

[lint]
select = ["E", "F", "B", "I", "N"]
ignore = ["D"]
fixable = ["ALL"]

[lint.flake8-bugbear]
# ninja.Query/Body/Form are sentinel markers, not real function calls
extend-immutable-calls = ["ninja.Query", "ninja.Body", "ninja.Form", "ninja.Header", "ninja.Cookie", "ninja.Path"]
