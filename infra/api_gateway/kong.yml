_format_version: "3.0"

services:
  - name: backend
    url: http://backend:8010
    routes:
      - name: all-routes
        paths:
          - /
        strip_path: false
    plugins:
      - name: cors
        config:
          origins:
            - "http://localhost:8080"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - Idempotency-Key
          credentials: true
          preflight_continue: false
          max_age: 3600
      - name: pre-function
        config:
          access:
            - |
              kong.service.request.clear_header("X-User-ID")
              kong.service.request.clear_header("X-Tenant-ID")
              kong.service.request.clear_header("X-CTX-User-ID")
              kong.service.request.clear_header("X-CTX-Tenant-ID")

              local gateway_token = kong.vault.get("{vault://env/EXPECTED_GATEWAY_TOKEN}")
              if not gateway_token then
                return kong.response.exit(500, { message = "Gateway trust configuration unavailable" })
              end
              kong.service.request.set_header("X-Gateway-Token", gateway_token)
