name: Infrastructure tests

# Shared infrastructure can change through any domain; keep the gate unfiltered.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: infra-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  infra:
    name: infra
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      PAYMENTS_POSTGRES_IMAGE: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
      PAYMENTS_REDIS_IMAGE: redis:7.2-alpine@sha256:dfa18828cbc07b3ae6a95ec7343f6c214fdee2d836197b4be8e9904420762cd8
      INFRA_COMPARISON_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      INFRA_TEST_BACKEND_IMAGE: complect-infra-ci:${{ github.run_id }}-${{ github.run_attempt }}
      INFRA_TEST_QUALITY_IMAGE: complect-infra-quality:${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare evidence directory
        run: mkdir -p "$RUNNER_TEMP/infra-ci"
      - name: Build locked backend image
        run: |
          set -euo pipefail
          docker build -f backend/Dockerfile.dev -t "$INFRA_TEST_BACKEND_IMAGE" backend \
            2>&1 | tee "$RUNNER_TEMP/infra-ci/build.log"
      - name: Build offline quality image
        run: |
          set -euo pipefail
          docker build \
            --build-arg BASE_IMAGE="$INFRA_TEST_BACKEND_IMAGE" \
            -f infra/Dockerfile.tests \
            -t "$INFRA_TEST_QUALITY_IMAGE" . \
            2>&1 | tee "$RUNNER_TEMP/infra-ci/quality-build.log"
      - name: Prepare existing pinned Payments images
        run: |
          set -euo pipefail
          docker pull "$PAYMENTS_POSTGRES_IMAGE" 2>&1 | tee "$RUNNER_TEMP/infra-ci/postgres-image.log"
          docker pull "$PAYMENTS_REDIS_IMAGE" 2>&1 | tee "$RUNNER_TEMP/infra-ci/redis-image.log"
      - name: Run the local infrastructure gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$INFRA_COMPARISON_BASE^{commit}"; then
            git fetch --no-tags --depth=1 origin "$INFRA_COMPARISON_BASE"
          fi
          python3 -B -m infra.scripts.ci_gate_producer \
            --output "$RUNNER_TEMP/infra-ci/producer" \
            --artifact gate=gate/result.json \
            -- make agent-infra-test \
            INFRA_TEST_ARGS="--base $INFRA_COMPARISON_BASE --output $RUNNER_TEMP/infra-ci/producer/gate" \
            2>&1 | tee "$RUNNER_TEMP/infra-ci/tests.log"
      - name: Upload infrastructure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: infra-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/infra-ci
          if-no-files-found: error
          retention-days: 7
