name: IAM CI

# No path filters: common/auth/settings/migrations/infra can affect this gate.
on:
  push:
    branches:
      - main
      - docs/iam-identity-roadmap
  pull_request:
    branches:
      - main
  # Manual dispatch becomes available after this workflow reaches the default branch.
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: iam-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_PROJECT_NAME: iam-ci-${{ github.run_id }}-${{ github.run_attempt }}
      # Fresh GitHub-hosted runner only: one /24 from the disposable test pool
      # in docs/development/workstations.md, separate from checkout/host ranges.
      # All Compose steps, including diagnostics/cleanup, inherit explicit IPAM
      # without Docker automatic allocation or generated .env.dev/provenance state.
      COMPLECT_DOCKER_SUBNET: "198.19.0.0/24"
      DADATA_API_KEY: ""
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Generate disposable canonical secrets
        run: |
          set -euo pipefail
          umask 077
          if [[ -e ".dev/secrets" || -L ".dev/secrets" ]]; then
            echo "Refusing to overwrite CI secret state" >&2
            exit 1
          fi
          install -d -m 700 ".dev/secrets"
          touch "$RUNNER_TEMP/iam-ci-owned-secrets"
          for file in django_secret_key postgres_password replication_password minio_password gateway_token; do
            value=$(openssl rand -hex 32)
            printf '%s\n' "$value" > ".dev/secrets/$file"
          done
          unset value

      - name: Validate configuration and pull dependencies
        run: |
          set -euo pipefail
          docker compose version
          # The unmodified test runner uses this fixed network. Hosted jobs get
          # a fresh daemon; never attach this CI stack to an existing dev network.
          if docker network inspect erp_network >/dev/null 2>&1; then
            echo "Refusing to use an existing erp_network" >&2
            exit 1
          fi
          docker compose -f docker-compose.dev.yml config --quiet
          touch "$RUNNER_TEMP/iam-ci-owned-stack"
          docker compose -f docker-compose.dev.yml pull postgres_primary redis minio clamav api_gateway

      - name: Resolve runtime secret owners
        run: |
          set -euo pipefail
          runtime_contract="$(
            docker compose -f docker-compose.dev.yml config --format json |
              python3 -c '
          import json
          import sys

          services = json.load(sys.stdin)["services"]
          for variable, service in (
              ("POSTGRES_IMAGE", "postgres_primary"),
              ("KONG_IMAGE", "api_gateway"),
              ("MINIO_IMAGE", "minio"),
          ):
              image = services[service].get("image")
              if not isinstance(image, str) or not image:
                  raise SystemExit(
                      f"Rendered Compose {service} image must be a non-empty string"
                  )
              print(f"{variable}={image}")

          user = services["backend"].get("user")
          if not isinstance(user, str):
              raise SystemExit("Rendered Compose backend user must be UID:GID")
          uid, separator, gid = user.partition(":")
          if separator != ":" or not uid.isdigit() or not gid.isdigit():
              raise SystemExit("Rendered Compose backend user must be numeric UID:GID")
          print(f"DEV_UID={uid}")
          print(f"DEV_GID={gid}")
          '
          )"
          while IFS='=' read -r variable value; do
            case "$variable" in
              POSTGRES_IMAGE|KONG_IMAGE|MINIO_IMAGE|DEV_UID|DEV_GID)
                printf -v "$variable" '%s' "$value"
                ;;
              *)
                echo "Unexpected runtime contract variable: $variable" >&2
                exit 1
                ;;
            esac
          done <<< "$runtime_contract"
          for variable in POSTGRES_IMAGE KONG_IMAGE MINIO_IMAGE DEV_UID DEV_GID; do
            [[ -n "${!variable:-}" ]] || {
              echo "Missing runtime contract variable: $variable" >&2
              exit 1
            }
          done
          DEV_POSTGRES_UID=$(docker run --rm --network none --entrypoint id "$POSTGRES_IMAGE" -u postgres)
          DEV_POSTGRES_GID=$(docker run --rm --network none --entrypoint id "$POSTGRES_IMAGE" -g postgres)
          DEV_KONG_UID=$(docker run --rm --network none --entrypoint id "$KONG_IMAGE" -u)
          DEV_KONG_GID=$(docker run --rm --network none --entrypoint id "$KONG_IMAGE" -g)
          DEV_MINIO_UID=$(docker run --rm --network none --entrypoint id "$MINIO_IMAGE" -u)
          DEV_MINIO_GID=$(docker run --rm --network none --entrypoint id "$MINIO_IMAGE" -g)
          for variable in \
            DEV_POSTGRES_UID DEV_POSTGRES_GID DEV_KONG_UID DEV_KONG_GID \
            DEV_MINIO_UID DEV_MINIO_GID DEV_UID DEV_GID; do
            [[ "${!variable}" =~ ^[0-9]+$ ]] || {
              echo "Non-numeric runtime owner: $variable" >&2
              exit 1
            }
            printf '%s=%s\n' "$variable" "${!variable}" >> "$GITHUB_ENV"
          done

      - name: Materialize runtime secrets
        run: |
          set -euo pipefail
          docker compose -f docker-compose.dev.yml run --rm --no-deps secrets_init

      - name: Validate runtime secret metadata
        run: |
          set -euo pipefail
          docker compose -f docker-compose.dev.yml run --rm --no-deps --entrypoint sh secrets_init -ec '
            expected_mode=0400
            for specification in "$@"; do
              name=${specification%%:*}
              expected_owner=${specification#*:}
              path="/run/complect-secrets/$name"
              if [ ! -f "$path" ] || [ -L "$path" ]; then
                echo "Missing regular runtime secret: $name" >&2
                exit 1
              fi
              actual_owner="$(stat -c "%u:%g" "$path")"
              actual_mode="$(stat -c "%a" "$path")"
              size="$(stat -c "%s" "$path")"
              if [ "$actual_owner" != "$expected_owner" ] || [ "$actual_mode" != "${expected_mode#0}" ] || [ "$size" -le 0 ]; then
                echo "Runtime secret metadata differs: $name" >&2
                exit 1
              fi
            done
            printf "PASS: runtime secret metadata verified\n"
          ' -- \
            "postgres_password:$DEV_POSTGRES_UID:$DEV_POSTGRES_GID" \
            "replication_password:$DEV_POSTGRES_UID:$DEV_POSTGRES_GID" \
            "minio_password:$DEV_MINIO_UID:$DEV_MINIO_GID" \
            "django_secret_key:$DEV_UID:$DEV_GID" \
            "app_postgres_password:$DEV_UID:$DEV_GID" \
            "app_gateway_token:$DEV_UID:$DEV_GID" \
            "gateway_token:$DEV_KONG_UID:$DEV_KONG_GID"

      - name: Build backend and boot infrastructure
        timeout-minutes: 15
        run: |
          set -euo pipefail
          docker compose -f docker-compose.dev.yml build backend
          docker compose -f docker-compose.dev.yml up -d --wait --wait-timeout 600 \
            postgres_primary postgres_replica redis minio clamav

      - name: Prepare schema volume ownership
        run: |
          set -euo pipefail
          # Fresh dev_state is root-owned; migrate writes its receipt as DEV_UID.
          # Reuse the canonical initializer before the first migration write.
          docker compose -f docker-compose.dev.yml run --rm --no-deps volume_init

      - name: Apply reviewed schema migrations
        timeout-minutes: 15
        run: |
          set -euo pipefail
          docker compose -f docker-compose.dev.yml run --rm --no-deps migrate

      - name: Wait for schema and replica readiness
        timeout-minutes: 4
        run: |
          set -euo pipefail
          # ready validates the receipt/ledger and replica migration history.
          # Retry only the read-only gate, never migration application.
          timeout --signal=TERM --kill-after=10s 180s bash -c '
            until docker compose -f docker-compose.dev.yml run --rm --no-deps migrate \
              python -B -m config.dev_database ready; do
              sleep 3
            done
          '

      - name: Boot backend after schema readiness
        run: |
          set -euo pipefail
          docker compose -f docker-compose.dev.yml up -d --no-build --wait --wait-timeout 600 backend
          docker compose -f docker-compose.dev.yml ps
          docker compose -f docker-compose.dev.yml exec -T backend \
            curl --fail --silent --show-error http://localhost:8010/health/

      - name: Django system check
        run: docker compose -f docker-compose.dev.yml exec -T backend python manage.py check

      - name: Users migration drift
        run: docker compose -f docker-compose.dev.yml exec -T backend python manage.py makemigrations users --check --dry-run

      - name: IAM fence critical tests
        run: bash infra/scripts/run_iam_fence_tests.sh apps/users/tests/test_identity_audit_fence.py

      - name: Full backend regression
        run: bash infra/scripts/run_iam_fence_tests.sh apps --maxfail=10

      # Repository-wide mypy, migration/DDD linters, makemigrations, frontend,
      # E2E and CodeQL are deliberately not required here: existing findings
      # need separate classification/remediation before adding green gates.
      - name: Failure diagnostics
        if: failure()
        run: |
          docker compose -f docker-compose.dev.yml ps || true
          docker compose -f docker-compose.dev.yml logs --no-color --tail=200 backend || true
          docker compose -f docker-compose.dev.yml logs --no-color --tail=200 postgres_primary || true

      - name: Remove disposable resources
        if: always()
        run: |
          set +e
          cleanup_status=0
          if [[ -f "$RUNNER_TEMP/iam-ci-owned-stack" ]]; then
            # Remove runner Redis orphans before removing their network. This
            # name prefix is safe on this job's fresh GitHub-hosted daemon.
            redis_ids=$(docker ps -aq --filter 'name=^/complect-iam-test-')
            result=$?
            if (( result != 0 )); then cleanup_status=$result; fi
            if [[ -n "$redis_ids" ]]; then
              readarray -t redis_containers <<< "$redis_ids"
              docker rm -f "${redis_containers[@]}"
              result=$?
              if (( result != 0 )); then cleanup_status=$result; fi
            fi
            docker compose -f docker-compose.dev.yml down -v --remove-orphans
            result=$?
            if (( result != 0 )); then cleanup_status=$result; fi
          fi
          if [[ -f "$RUNNER_TEMP/iam-ci-owned-secrets" ]]; then
            rm -rf -- .dev/secrets
            result=$?
            if (( result != 0 )); then cleanup_status=$result; fi
          fi
          rm -f "$RUNNER_TEMP/iam-ci-owned-secrets" "$RUNNER_TEMP/iam-ci-owned-stack"
          exit "$cleanup_status"
