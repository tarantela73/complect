networks:
  erp_network:
    name: erp_network
    driver: bridge

volumes:
  pg_primary_data:
  pg_replica_data:
  redisdata:
  s3data:
  grafana_data:
  frontend_nm:
  frontend_next:
  supermemory_data:

secrets:
  db_root_password:
    file: ./infra/secrets/dev_db_password.txt
  s3_root_password:
    file: ./infra/secrets/dev_s3_password.txt

services:
  # --- DATABASE CONTEXT (PostgreSQL 16 + PostGIS кластер репликации) ---
  postgres_primary:
    image: postgis/postgis:16-3.4
    container_name: complect_postgres_primary
    restart: unless-stopped
    environment:
      POSTGRES_DB: complect_db
      POSTGRES_USER: complect_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_root_password
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
      -c hba_file=/var/lib/postgresql/data/pg_hba.conf
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - pg_primary_data:/var/lib/postgresql/data
    secrets:
      - db_root_password
    networks:
      - erp_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U complect_admin -d complect_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_replica:
    image: postgis/postgis:16-3.4
    container_name: complect_postgres_replica
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_REPLICATION_PASSWORD}2026
    ports:
      - "5433:5432"
    volumes:
      - pg_replica_data:/var/lib/postgresql/data
    networks:
      - erp_network
    entrypoint: >
      bash -c "
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        echo 'Инициализация реплики: копирование базы мастера...';
        until pg_isready -h postgres_primary -p 5432 -U complect_admin -d complect_db; do
          echo 'Ожидание primary мастера...';
          sleep 1;
        done;
        rm -rf /var/lib/postgresql/data/*;
        pg_basebackup -h postgres_primary -p 5432 -D /var/lib/postgresql/data -U replicator -v -P -R -X stream;
        echo 'Базовый бэкап завершен, запускаю реплику';
      fi;
      exec docker-entrypoint.sh postgres -c hot_standby=on
      "
    depends_on:
      postgres_primary:
        condition: service_healthy

  # --- REALTIME & CACHE LAYER (Redis Alpine) ---
  redis:
    image: redis:7.2-alpine
    container_name: complect_redis_dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - erp_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- LOCAL AGENT MEMORY (host llama.cpp + Supermemory) ---
  supermemory_data_init:
    image: busybox:1.37.0
    container_name: complect_supermemory_data_init
    restart: "no"
    user: "0:0"
    network_mode: none
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    volumes:
      - supermemory_data:/data

  supermemory:
    build:
      context: ./infra/supermemory
      args:
        SUPERMEMORY_SERVER_VERSION: 0.0.6
    container_name: complect_supermemory
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      HOME: /data
      PORT: "6767"
      OPENAI_BASE_URL: http://host.docker.internal:8090/v1
      OPENAI_API_KEY: local-llama-cpp
      OPENAI_MODEL: qwen3-coder
      WORKFLOW_ENGINE: direct
      SUPERMEMORY_DATA_DIR: /data
      SUPERMEMORY_DISABLE_TELEMETRY: "1"
    ports:
      - "127.0.0.1:6767:6767"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - supermemory_data:/data
    tmpfs:
      - /tmp:rw,nosuid,size=512m
    networks:
      - erp_network
    depends_on:
      supermemory_data_init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:6767/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # --- STORAGE LAYER CONTEXT (MinIO S3 API) ---
  minio:
    image: minio/minio:latest
    container_name: complect_minio_dev
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: complect_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/s3_root_password
    command: server /data --console-address ":9001"
    volumes:
      - s3data:/data
    secrets:
      - s3_root_password
    networks:
      - erp_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- S3 AUTO-BOOTSTRAP (Init Container) ---
  s3_bootstrap:
    image: minio/mc:latest
    container_name: complect_s3_bootstrap
    secrets:
      - s3_root_password
    networks:
      - erp_network
    entrypoint: >
      bash -c "
        until mc alias set myminio http://minio:9000 complect_root_user \$(cat /run/secrets/s3_root_password); do
          echo 'Ожидание доступности MinIO S3 API...';
          sleep 1;
        done &&
        mc mb --ignore-existing myminio/complect-quarantine &&
        mc mb --ignore-existing myminio/complect-production &&
        echo 'S3 BUCKETS CONTOURS INITIALIZED SUCCESSFUL'
      "
    depends_on:
      minio:
        condition: service_healthy

  # --- ANTIVIRUS CONTEXT (ClamAV Daemon TCP) ---
  clamav:
    image: clamav/clamav:latest
    container_name: complect_clamav_dev
    ports:
      - "3310:3310"
    networks:
      - erp_network
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 2 localhost 3310 | grep PONG || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- API GATEWAY LAYER (Kong Proxy) ---
  api_gateway:
    image: kong:latest
    container_name: complect_gateway_dev
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - ./infra/api_gateway/kong.yml:/etc/kong/kong.yml:ro
    networks:
      - erp_network
    depends_on:
      postgres_primary:
        condition: service_healthy
      redis:
        condition: service_healthy

    # --- BACKEND MONOLITH (Django ASGI Engine) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: complect_backend_dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
    secrets:
      - db_root_password
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      ENVIRONMENT: local
      DJANGO_SETTINGS_MODULE: config.settings.local
      DEBUG: "true"
      TIME_ZONE: UTC
      LANGUAGE_CODE: ru-ru
      POSTGRES_DB: complect_db
      POSTGRES_USER: complect_admin
      DATABASE_HOST: postgres_primary
      DATABASE_REPLICA_HOST: postgres_replica
      DATABASE_PASSWORD_FILE: /run/secrets/db_root_password
      SECRET_KEY: ${SECRET_KEY}32chars
      POSTGRES_REPLICA_ENABLED: "true"
      POSTGRES_REPLICA_MAX_LAG: "1.0"
      REDIS_DEFAULT_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      REDIS_CELERY_URL: redis://redis:6379/2
      REDIS_STREAMS_URL: redis://redis:6379/3
      REDIS_IDEMPOTENCY_URL: redis://redis:6379/4
      CHANNEL_LAYER_URL: redis://redis:6379/5
      CELERY_RESULT_BACKEND: redis://redis:6379/6
      REDIS_AUDIT_URL: redis://redis:6379/7
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      CLAMAV_TIMEOUT: 120
      MAX_UPLOAD_SIZE_MB: 50
      DATA_UPLOAD_MAX_MEMORY_SIZE: 52428800
      FILE_UPLOAD_MAX_MEMORY_SIZE: 52428800
      EXPECTED_GATEWAY_TOKEN: ${EXPECTED_GATEWAY_TOKEN}
      DADATA_API_KEY: ${DADATA_API_KEY}
    ports:
      - "8010:8010"
    networks:
      - erp_network
    command: >
      bash -c "
        python manage.py migrate --noinput &&
        granian --interface asginl --host 0.0.0.0 --port 8010 --workers 1 --reload --reload-ignore-dirs .ruff_cache config.asgi:application
      "


    depends_on:
      postgres_primary:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8010/health/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

    # --- ASYNC CELERY WORKER CONTOUR ---
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: complect_celery_worker
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
    secrets:
      - db_root_password
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      ENVIRONMENT: local
      DJANGO_SETTINGS_MODULE: config.settings.local
      DEBUG: "true"
      TIME_ZONE: UTC
      LANGUAGE_CODE: ru-ru
      POSTGRES_DB: complect_db
      POSTGRES_USER: complect_admin
      DATABASE_HOST: postgres_primary
      DATABASE_REPLICA_HOST: postgres_replica
      DATABASE_PASSWORD_FILE: /run/secrets/db_root_password
      SECRET_KEY: ${SECRET_KEY}32chars
      POSTGRES_REPLICA_ENABLED: "true"
      POSTGRES_REPLICA_MAX_LAG: "1.0"
      REDIS_DEFAULT_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/1
      REDIS_CELERY_URL: redis://redis:6379/2
      REDIS_STREAMS_URL: redis://redis:6379/3
      REDIS_IDEMPOTENCY_URL: redis://redis:6379/4
      CHANNEL_LAYER_URL: redis://redis:6379/5
      CELERY_RESULT_BACKEND: redis://redis:6379/6
      REDIS_AUDIT_URL: redis://redis:6379/7
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    networks:
      - erp_network
    command: celery -A config worker --loglevel=info -Q default,outbox,notifications,finance,files,retention,integration -c 4

    depends_on:
      postgres_primary:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- ASYNC CELERY BEAT CONTOUR ---
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: complect_celery_beat
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      ENVIRONMENT: local
      DJANGO_SETTINGS_MODULE: config.settings.local
      DEBUG: "true"
      TIME_ZONE: UTC
      LANGUAGE_CODE: ru-ru
      REDIS_DEFAULT_URL: redis://redis:6379/0
      REDIS_CELERY_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/6
    networks:
      - erp_network
    command: celery -A config beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy


  # --- OBSERVABILITY BOOTSTRAP SYSTEM ---
  otel_collector:
    image: otel/opentelemetry-collector-contrib:0.95.0
    container_name: complect_otel_collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/opentelemetry/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"
    networks:
      - erp_network

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: complect_jaeger
    ports:
      - "16686:16686"
    networks:
      - erp_network

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: complect_prometheus
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - erp_network

    # --- OBSERVABILITY BOOTSTRAP SYSTEM ---
  grafana:
    image: grafana/grafana:10.4.0
    container_name: complect_grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - erp_network

  # --- FRONTEND CLIENT COMPONENTS ---
  frontend:
    image: node:22-alpine
    container_name: complect_frontend_dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_nm:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "8080:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
      - NODE_ENV=development
      - TURBOPACK=1
      - WATCHPACK_POLLING=true
    networks:
      - erp_network
    command: sh -c "npm install --no-audit --no-fund && npm run dev"


